name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          yes | sdkmanager --sdk_root=$ANDROID_HOME "platforms;android-34" "build-tools;34.0.0"
          cd app
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x build.gradle.kts || true
          export JAVA_HOME
          ../gradlew assembleDebug --no-daemon || gradle assembleDebug --no-daemon || ./gradlew assembleDebug --no-daemon || true
          # Fallback direct build if wrapper missing
          javac -version

      - name: Find and Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iPhone17-Pro-Style-Editor-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            **/app-debug.apk
