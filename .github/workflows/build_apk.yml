name: Build Android APK
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android SDK 34
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Generate official Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7 --distribution-type bin --no-daemon 2>&1 | tee wrapper.log
      - name: Unit tests, Android lint and APK
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --console=plain --stacktrace --no-daemon 2>&1 | tee build.log
      - name: Publish failure details in run annotations
        if: failure()
        run: python3 .github/scripts/report_build_failure.py
      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/SHA256SUMS.txt
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ProCam17-debug-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload generated wrapper for local builds
        uses: actions/upload-artifact@v4
        with:
          name: Gradle-Wrapper-8.7
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/
          if-no-files-found: error
      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-reports
          path: |
            app/build/reports/
            app/build/test-results/
            build.log
            wrapper.log
          if-no-files-found: ignore
